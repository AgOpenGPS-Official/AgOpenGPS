name: Android

on:
  push:
    paths:
      - 'SourceCode/Android/**'
      - 'SourceCode/AgLibrary.Ntrip/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'SourceCode/Android/**'
      - 'SourceCode/AgLibrary.Ntrip/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

defaults:
  run:
    # SourceCode/Android has its own global.json (.NET 10).
    working-directory: SourceCode/Android

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install Android workload
      run: dotnet workload install android

    - name: Test core library
      run: dotnet test AgOpenGPS.Mobile.Core.Tests --configuration Release

    - name: Build APK
      # The runner image ships the Android SDK in $ANDROID_HOME.
      run: dotnet publish AgOpenGPS.Android --configuration Release -p:AndroidSdkDirectory="$ANDROID_HOME"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AgOpenGPS-Android
        path: SourceCode/Android/AgOpenGPS.Android/bin/Release/net10.0-android/publish/*-Signed.apk
        if-no-files-found: error
